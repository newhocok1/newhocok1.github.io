<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Должен ли я Диме денег?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            background-image: radial-gradient(circle at 50% 0%, #1a1025 0%, #0d0d0d 60%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #a855f7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle { color: #888; font-size: 1em; margin-bottom: 40px; }

        /* Контейнер рулетки */
        .roulette-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 40px;
        }

        /* Круг, который вращается */
        .roulette-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #2a2a2a;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 6s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            /* 99% зелёный, 1% красный */
            background: conic-gradient(
                #22c55e 0% 99%,
                #ef4444 99% 100%
            );
        }

        /* Синяя стрелка внутри круга */
        .arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 120px;
            background: #2563eb;
            transform-origin: center bottom;
            transform: translate(-50%, -100%) rotate(0deg);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.8);
            z-index: 10;
        }

        /* Круг в центре */
        .center-circle {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            background: #0d0d0d;
            border-radius: 50%;
            border: 4px solid #2563eb;
            z-index: 15;
        }

        /* Подписи Да и Нет */
        .label-yes, .label-no {
            position: absolute;
            font-size: 1.5em;
            font-weight: 800;
            z-index: 20;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        .label-yes {
            color: #fff;
            top: 55%;
            left: 65%;
        }
        .label-no {
            color: #fff;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
        }

        button {
            background: linear-gradient(90deg, #a855f7, #7c3aed);
            color: #fff; border: none;
            padding: 16px 48px;
            font-size: 1.2em; font-weight: 700;
            border-radius: 12px; cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        button:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(168, 85, 247, 0.7); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .result {
            margin-top: 30px;
            font-size: 1.8em;
            font-weight: 800;
            min-height: 60px;
            color: #ef4444;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .result.show { opacity: 1; }

        .chance-info { color: #666; font-size: 0.85em; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Должен ли я Диме денег?</h1>
    <p class="subtitle">Крути рулетку, чтобы узнать ответ</p>

    <div class="roulette-container">
        <div class="roulette-wheel" id="wheel">
            <div class="arrow"></div>
            <div class="center-circle"></div>
            <div class="label-no">Нет</div>
            <div class="label-yes">Да</div>
        </div>
    </div>

    <button id="spinBtn" onclick="spin()">Крутить</button>

    <div class="result" id="result"></div>
    <p class="chance-info">Шанс: 99% — да (зелёный), 1% — нет (красный)</p>

    <script>
        let isSpinning = false;
        let currentRotation = 0;

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('result').classList.remove('show');

            const wheel = document.getElementById('wheel');

            // Красный сектор: от 99% до 100%, то есть от 356.4° до 360°.
            // Середина красного = 358.2°. Стрелка смотрит вверх (0°).
            // Чтобы красный встал под стрелку, поворачиваем круг на 360° - 358.2° = 1.8°.
            // Плюс полные обороты для эффекта.
            const extraSpins = 5 + Math.floor(Math.random() * 3);
            const targetAngle = 360 - 358.2;
            const totalRotation = currentRotation + (extraSpins * 360) + targetAngle;

            currentRotation = totalRotation;
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                document.getElementById('result').textContent = '❌ НЕТ';
                document.getElementById('result').classList.add('show');
                document.getElementById('spinBtn').disabled = false;
                isSpinning = false;
            }, 6000);
        }
    </script>
</body>
</html>
