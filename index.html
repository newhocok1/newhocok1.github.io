<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoVerse — Фильмы и сериалы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="logo">🎬 Kino<span>Verse</span></div>
        <div class="search">
            <span>🔍</span>
            <input id="searchInput" placeholder="Найти фильм или сериал...">
        </div>
    </header>

    <section class="hero">
        <div class="hero-art"></div>
        <div class="hero-content">
            <div class="hero-kicker">ФИЛЬМ НЕДЕЛИ</div>
            <h1>Дюна: Часть вторая</h1>
            <div class="hero-meta">★ 8.4　·　2024　·　Фантастика　·　2 ч 46 мин</div>
            <p>Пол Атрейдес объединяется с Чани и фременами, чтобы отомстить заговорщикам, уничтожившим его семью.</p>
            <div class="hero-buttons">
                <button class="watch">▶ Смотреть</button>
                <button class="save">＋ В список</button>
            </div>
        </div>
    </section>

    <main class="content">

        <section class="section">
            <div class="section-head">
                <h2>✨ Новинки</h2>
                <a href="#">Смотреть все</a>
            </div>
            <div class="cards" id="newGrid"></div>
        </section>

        <section class="section">
            <div class="section-head">
                <h2>🎬 Фильмы</h2>
                <a href="#">Смотреть все</a>
            </div>
            <div class="cards" id="moviesGrid"></div>
        </section>

        <section class="section">
            <div class="section-head">
                <h2>📺 Сериалы</h2>
                <a href="#">Смотреть все</a>
            </div>
            <div class="cards" id="seriesGrid"></div>
        </section>

    </main>

    <footer>
        © 2026 KinoVerse — Все права защищены
    </footer>

    <script>
        // ============================================
        // СПИСОК ФИЛЬМОВ И СЕРИАЛОВ
        // ============================================
        // Чтобы добавить новый фильм, скопируй блок { ... } и вставь ниже через запятую.
        // Поля:
        //   title — название
        //   year — год
        //   rating — рейтинг (число)
        //   genre — жанр
        //   type — "movie" для фильма, "series" для сериала
        //   poster — ссылка на картинку
        //   link — ссылка куда ведёт кнопка

        const content = [
            {
                title: "Джон Уик 4",
                year: 2023,
                rating: 7.6,
                genre: "Боевик",
                type: "movie",
                poster: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400",
                link: "#"
            },
            {
                title: "Интерстеллар",
                year: 2014,
                rating: 8.7,
                genre: "Фантастика",
                type: "movie",
                poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400",
                link: "#"
            },
            {
                title: "Бойцовский клуб",
                year: 1999,
                rating: 8.8,
                genre: "Драма",
                type: "movie",
                poster: "https://images.unsplash.com/photo-1476275466078-4007374efbbe?w=400",
                link: "#"
            },
            {
                title: "Начало",
                year: 2010,
                rating: 8.8,
                genre: "Фантастика",
                type: "movie",
                poster: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400",
                link: "#"
            },
            {
                title: "Гладиатор",
                year: 2000,
                rating: 8.5,
                genre: "Боевик",
                type: "movie",
                poster: "https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400",
                link: "#"
            },
            {
                title: "Матрица",
                year: 1999,
                rating: 8.7,
                genre: "Фантастика",
                type: "movie",
                poster: "https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=400",
                link: "#"
            },
            {
                title: "Во все тяжкие",
                year: 2008,
                rating: 9.5,
                genre: "Драма",
                type: "series",
                poster: "https://images.unsplash.com/photo-1618666012174-83b56e4326eb?w=400",
                link: "#"
            },
            {
                title: "Игра престолов",
                year: 2011,
                rating: 9.2,
                genre: "Фэнтези",
                type: "series",
                poster: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400",
                link: "#"
            },
            {
                title: "Чёрное зеркало",
                year: 2011,
                rating: 8.8,
                genre: "Фантастика",
                type: "series",
                poster: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=400",
                link: "#"
            }
        ];

        function createCard(item) {
            return `
                <div class="card" onclick="window.open('${item.link}', '_blank')">
                    <div class="card-poster">
                        <img src="${item.poster}" alt="${item.title}" onerror="this.style.display='none'; this.parentElement.innerHTML='🎬';">
                        <div class="card-rating">★ ${item.rating}</div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-meta">${item.year} · ${item.genre}</div>
                    </div>
                </div>
            `;
        }

        document.getElementById('newGrid').innerHTML = content.slice(0, 6).map(createCard).join('');
        document.getElementById('moviesGrid').innerHTML = content.filter(i => i.type === 'movie').map(createCard).join('');
        document.getElementById('seriesGrid').innerHTML = content.filter(i => i.type === 'series').map(createCard).join('');

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                card.style.display = title.includes(q) ? '' : 'none';
            });
        });
    </script>

</body>
</html>
